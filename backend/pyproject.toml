[project]
name = "pm-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "itsdangerous>=2.2.0",
    "openai>=3.36.1",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 90
show_missing = true
